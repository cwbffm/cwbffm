name: Terraform Network

on:
  push:
    branches: [cwbffm]
    paths:
      - "projects/oci-terraform-network/**"
      - ".github/workflows/terraform-network.yml"
  pull_request:
    paths:
      - "projects/oci-terraform-network/**"
      - ".github/workflows/terraform-network.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/oci-terraform-network

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform fmt -check -recursive
      - name: Initialize provider
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate
      - name: Test with mocked OCI provider
        run: terraform test -no-color
